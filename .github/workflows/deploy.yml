name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly refresh so Travel and concerts sheet edits reach the static snapshot
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Refresh travel data from the Google Sheet
        run: node scripts/fetch-travel.mjs || echo "sheet unreachable; using committed snapshot"
      - name: Refresh concerts from the Google Sheet
        run: node scripts/fetch-concerts.mjs || echo "sheet unreachable or malformed; using committed snapshot"
      - name: Refresh essays from Substack
        run: node scripts/fetch-essays.mjs || echo "feed unreachable; using committed snapshot"
      - name: Match books to LibraryThing for covers and descriptions
        run: node scripts/fetch-library.mjs || echo "LibraryThing or Open Library unreachable; using committed library data"
      - name: Look up page counts for newly added books
        run: node scripts/fetch-pages.mjs || echo "Open Library unreachable; using committed page counts"
      - name: Look up covers for newly added books from Open Library
        run: node scripts/fetch-covers.mjs || echo "Open Library unreachable; using committed covers"
      - run: npm run build
      - run: npx vitest run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
